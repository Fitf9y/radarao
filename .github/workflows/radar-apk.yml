name: Radar APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fetch radar binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/radar app/src/main/jniLibs/arm64-v8a
          gh release download radar-bin --repo "${{ github.repository }}" --dir /tmp/radar
          cp /tmp/radar/radar-patched app/src/main/jniLibs/arm64-v8a/libradar.so
          cp /tmp/radar/lib*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a

      - run: ./gradlew assembleStandardDebug

      - uses: actions/upload-artifact@v4
        with:
          name: radar-apk
          path: app/build/outputs/apk/**/*.apk
